[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
[project]
name        = "s8kpred"
version     = "0.1.0"
description = "Protein secondary structure prediction (3-state & 8-state) using XGBoost and PSSM features"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.9"

keywords = [
    "bioinformatics", "protein", "secondary structure",
    "machine learning", "xgboost", "PSSM", "PSI-BLAST",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# Core runtime dependencies
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "xgboost>=1.7",
    "biopython>=1.80",    # SeqIO used for FASTA in PSSM pipeline
    "scikit-learn>=1.3",  # required by xgboost at predict time
]

# ---------------------------------------------------------------------------
[project.optional-dependencies]
# Cartoon plot support
plot = [
    "biotite>=0.38",
    "matplotlib>=3.7",
]
# Full dev environment
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine",
    "biotite>=0.38",
    "matplotlib>=3.7",
]

# ---------------------------------------------------------------------------
[project.scripts]
s8kpred = "s8kpred.cli:main"

# ---------------------------------------------------------------------------
[project.urls]
Homepage      = "https://github.com/mayank2801/s8kpred"
Documentation = "https://github.com/mayank2801/s8kpred#readme"
"Bug Tracker" = "https://github.com/mayank2801/s8kpred/issues"
Source        = "https://github.com/mayank2801/s8kpred"

# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["s8kpred*"]

[tool.setuptools.package-data]
"s8kpred.data" = ["*.csv", "*.json", "*.ubj"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
